name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt pip-audit==2.10.1
        working-directory: backend
      - name: Check installed dependency consistency
        run: python -m pip check
        working-directory: backend
      - name: Audit pinned dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
        working-directory: backend
      - name: Compile and run tests
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
        working-directory: backend

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
