apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bss-simulator
spec:
  tls:
    - hosts: ["${APP_HOST}"]
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: bss-simulator-api, port: {number: 8000}}}
          - path: /sim
            pathType: Prefix
            backend: {service: {name: bss-simulator-api, port: {number: 8000}}}
          - path: /health
            pathType: Prefix
            backend: {service: {name: bss-simulator-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: bss-simulator-ui, port: {number: 8080}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bss-simulator-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bss-simulator-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
