apiVersion: apps/v1
kind: Deployment
metadata:
  name: bss-simulator-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: bss-simulator-api}
  template:
    metadata:
      labels: {app: bss-simulator-api}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ${BACKEND_IMAGE}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: bss-simulator-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: bss-simulator-database, key: url}}
            - name: SIMULATOR_API_KEY
              valueFrom: {secretKeyRef: {name: bss-simulator-auth, key: api-key}}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: bss-simulator-api
spec:
  selector: {app: bss-simulator-api}
  ports: [{name: http, port: 8000, targetPort: http}]
